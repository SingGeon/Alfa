<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual history · ETH Price Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/evaluation.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/logo.png" alt="ETH Price Predictor">
    </a>
    <div class="topbar-actions">
      <a class="nav-link" href="/dashboard.html">📈 <span data-i18n="nav.dashboard">ETH Dashboard</span></a>
      <a class="nav-link" href="/evaluation.html">🎯 <span data-i18n="nav.evaluation">Evaluation</span></a>
      <a class="nav-link" href="/history.html">🗓️ <span data-i18n="nav.history">Day history</span></a>
      <a class="nav-link" href="/population.html">🧬 <span data-i18n="nav.population">Model population</span></a>
      <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria-label="nav.langToggleLabel">
        <button data-lang="en" type="button">EN</button>
        <button data-lang="ro" type="button">RO</button>
      </div>
    </div>
  </header>

  <div class="eval-intro">
    <h1 data-i18n="visual.title">Visual history</h1>
    <p id="visualSubtitle" class="eval-subtitle"></p>
  </div>

  <div id="errorBanner" class="error-banner" hidden></div>

  <section class="card">
    <div class="card-header" data-i18n="visual.stats.overall">General statistics</div>
    <div id="overallStats" class="vis-stats"></div>
  </section>

  <section class="card">
    <div class="vis-controls">
      <div class="vis-tabs" id="viewTabs" role="tablist">
        <button type="button" data-view="model" data-i18n="visual.view.model">By model</button>
        <button type="button" data-view="day" data-i18n="visual.view.day">By day</button>
      </div>
      <label class="vis-horizon"><span data-i18n="visual.filter.horizon">Horizon</span>
        <select id="horizonFilter">
          <option value="24" selected>24</option>
          <option value="" data-i18n="eval.filter.all">All</option>
        </select>
      </label>
    </div>

    <div id="modelNav">
      <div class="vis-nav-row"><span class="vis-nav-label" data-i18n="eval.filter.model">Model</span><div class="vis-tabs" id="modelTabs"></div></div>
      <div class="vis-nav-row"><span class="vis-nav-label" data-i18n="eval.filter.interval">Interval</span><div class="vis-tabs" id="intervalTabs"></div></div>
    </div>
    <div id="dayNav" hidden>
      <div class="vis-nav-row"><span class="vis-nav-label" data-i18n="visual.day">Day</span><div class="vis-tabs vis-tabs-scroll" id="dayTabs"></div></div>
      <p class="eval-hint" data-i18n="visual.dayHint">Days are in UTC.</p>
    </div>

    <div class="vis-selection">
      <div class="vis-selection-title" id="selectionTitle"></div>
      <div id="selectionStats" class="vis-stats"></div>
      <div id="breakdown" class="vis-breakdown"></div>
      <div id="stepStats" class="vis-breakdown"></div>
    </div>

    <div id="gallery"></div>
    <p id="galleryEmpty" class="eval-hint" data-i18n="visual.empty" hidden>No forecasts saved yet.</p>

    <div class="eval-pager" id="pager">
      <button id="prevPage" class="eval-btn" type="button" data-i18n="eval.prev">← Previous</button>
      <span id="pageInfo"></span>
      <button id="nextPage" class="eval-btn" type="button" data-i18n="eval.next">Next →</button>
    </div>
  </section>

</div>

<dialog id="chartDialog" class="eval-dialog">
  <form method="dialog"><button class="eval-btn eval-dialog-close" data-i18n="eval.close">Close</button></form>
  <img id="chartImg" alt="">
</dialog>

<script src="/i18n.js"></script>
<script src="/visual.js"></script>
</body>
</html>

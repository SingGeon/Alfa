<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day history · ETH Price Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/evaluation.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/logo.png" alt="ETH Price Predictor">
    </a>
    <div class="topbar-actions">
      <a class="nav-link" href="/dashboard.html">📈 <span data-i18n="nav.dashboard">ETH Dashboard</span></a>
      <a class="nav-link" href="/evaluation.html">🎯 <span data-i18n="nav.evaluation">Evaluation</span></a>
      <a class="nav-link" href="/visual.html">🖼️ <span data-i18n="nav.visual">Visual history</span></a>
      <a class="nav-link" href="/population.html">🧬 <span data-i18n="nav.population">Model population</span></a>
      <a class="nav-link" href="/fund.html">💼 <span data-i18n="nav.fund">Strategy fund</span></a>
      <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria-label="nav.langToggleLabel">
        <button data-lang="en" type="button">EN</button>
        <button data-lang="ro" type="button">RO</button>
      </div>
    </div>
  </header>

  <div class="eval-intro">
    <h1 data-i18n="history.title">Day history</h1>
    <p class="eval-subtitle" data-i18n="history.subtitle">End-of-day overview of every prediction chart.</p>
  </div>

  <div id="errorBanner" class="error-banner" hidden></div>

  <section class="card">
    <div class="eval-filters history-controls">
      <label><span data-i18n="history.date">Day</span>
        <select id="daySelect"></select>
      </label>
      <div id="dayLinks" class="history-links"></div>
    </div>
    <div id="dayStats" class="eval-summary-grid"></div>
    <p id="historyEmpty" class="eval-hint" data-i18n="history.empty" hidden>No daily overview yet.</p>
    <a id="overviewLink" class="history-overview" target="_blank" rel="noopener" hidden>
      <img id="overviewImg" alt="">
    </a>
  </section>

</div>
<script src="/i18n.js"></script>
<script src="/history.js"></script>
</body>
</html>

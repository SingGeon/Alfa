<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Detail — Scout AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/scout.css">
<link rel="stylesheet" href="/detail.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="assetBadge">?</span>
      <span class="brand-name" id="assetName">—</span>
    </div>

    <div class="ticker">
      <span class="ticker-pair" id="assetSymbol"></span>
      <span class="ticker-price" id="price">&nbsp;</span>
      <span class="ticker-change" id="change"></span>
    </div>

    <div class="topbar-actions">
      <a class="nav-link" href="/">🏠 <span data-i18n="nav.home">Home</span></a>
      <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria-label="nav.langToggleLabel">
        <button data-lang="en" type="button">EN</button>
        <button data-lang="ro" type="button">RO</button>
      </div>
      <button id="pinToggle" class="nav-link pin-toggle-btn" type="button" data-i18n="detail.pin.pin">☆ Pin</button>
      <a class="nav-link" href="/scout.html" data-i18n="detail.nav.toScout">← Scout AI</a>
    </div>
  </header>

  <div id="errorBanner" class="error-banner" hidden></div>

  <main class="layout">
    <section class="chart-panel">
      <div class="chart-wrap">
        <div id="chart" class="chart"></div>
        <div id="chartEmpty" class="chart-empty">
          <div class="chart-spinner"></div>
          <span data-i18n="detail.chart.analyzing">Analyzing real data + news...</span>
        </div>
        <div id="chartTooltip" class="chart-tooltip" hidden></div>
      </div>
      <div class="chart-legend">
        <span class="legend-item"><i class="dot up"></i><span data-i18n="common.legend.up">Up</span></span>
        <span class="legend-item"><i class="dot down"></i><span data-i18n="common.legend.down">Down</span></span>
        <span class="legend-item"><i class="dot pred"></i><span data-i18n="common.legend.pred">Prediction</span></span>
        <span class="legend-item"><i class="dot band"></i><span data-i18n="common.legend.band">Confidence interval</span></span>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card stat-card">
        <div class="stat">
          <span class="stat-label" data-i18n="common.stat.confidence">Confidence score</span>
          <span class="stat-value" id="confidence">—</span>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="common.stat.sentimentAvg">Average sentiment</span>
          <span class="stat-value" id="sentimentAvg">—</span>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="dashboard.stat.model">Model</span>
          <span class="stat-value stat-value--small">sklearn (ensemble)</span>
        </div>
      </div>

      <div class="card prediction-table-card">
        <div class="card-header" data-i18n="detail.prediction.header">Prediction (7 days)</div>
        <div class="table-scroll">
          <table class="prediction-table">
            <thead><tr><th data-i18n="detail.prediction.colDay">Day</th><th data-i18n="common.prediction.colPrice">Price</th><th data-i18n="common.prediction.colVsNow">vs. now</th></tr></thead>
            <tbody id="predictionRows">
              <tr class="empty-row"><td colspan="3">—</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </aside>
  </main>

  <section class="card narrative-card">
    <div class="card-header" data-i18n="detail.narrative.header">Why and when — model estimate</div>
    <p id="narrative" class="narrative" data-i18n="detail.narrative.loading">Loading...</p>
  </section>

  <section class="card news-card">
    <div class="card-header" data-i18n="detail.news.header">Analyzed news</div>
    <div class="news-list" id="newsList">
      <p class="empty-hint">—</p>
    </div>
  </section>

</div>
<script src="/i18n.js"></script>
<script src="/chart-utils.js"></script>
<script src="/detail.js"></script>
<script src="/topbar-scroll.js"></script>
</body>
</html>
